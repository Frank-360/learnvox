<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Create AI Classroom</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/create_classroom.css') }}">

</head>
<body>

<div class="classroom-wrapper">

    <div class="classroom-card">

        <h1>🎓 Create AI Classroom</h1>

        <p class="subtitle">

            Your AI Tutor has already studied your lesson.

            Create a classroom and begin teaching.

        </p>

        <form method="POST">

            <div class="readonly-card">

                <span class="label">
                    👨‍🏫 Host
                </span>

                <strong>
                    {{ host_name }}
                </strong>

            </div>

            <div class="readonly-card">

                <span class="label">
                    📄 Lesson
                </span>

                <strong>
                    {{ lesson_name }}
                </strong>

            </div>

            <div class="form-group">

                <label>

                    Classroom Title

                </label>

                <input
                    type="text"
                    name="title"
                    value="{{ lesson_name.split('.')[0] }}"
                    required>

            </div>

            <div class="form-group">

                <label>

                    Duration

                </label>

                <select name="duration">

                    <option>30 Minutes</option>

                    <option selected>60 Minutes</option>

                    <option>90 Minutes</option>

                    <option>120 Minutes</option>

                </select>

            </div>

            <button
                class="primary-btn">

                🚀 Create Classroom

            </button>

        </form>

    </div>

</div>

</body>
</html>
